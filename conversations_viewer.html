l refactoring steps are transparently logged for user review.\n\nI have successfully corrected and completely modernized the media library selection and image insertion system across the entire backend of the **Digitalium Group** project.\n\nHere is a summary of the technical improvements and structural additions made to solve the observed issues:\n\n### 1. Unified Reusable PHP Component (`MediaHelper`)\n* Created the helper class `App\\Helpers\\MediaHelper` inside `app/Helpers/MediaHelper.php`. \n* This class exposes a stateless method `renderField($inputName, $currentValue, $fieldId)` that standardizes image form elements. It outputs:\n  * An **image thumbnail preview** box displaying either the active visual asset or a default picture icon.\n  * A **hidden path input field** holding the actual database value.\n  * A styled **\"Choisir...\" button** to trigger selection.\n  * A styled **\"Supprimer\" button** (only visible when a media is selected) allowing immediate removal of the asset, viding the hidden input properly.\n  * A **file basename label** showing the selected media name.\n\n### 2. Centralized Gallery Modal & Global Event Delegation\n* Transferred and consolidated the duplicate media gallery modals into a single centralized HTML markup at the bottom of the master layout shell (`app/Views/admin/layout.php`).\n* Wrote a single unified, delegated JavaScript event listener registered on `document.body` that handles the entire media picker lifecycle:\n  * **Openings**: Intercepts clicks on any `.select-media-btn` globally, caching its `data-target` (input ID), `data-preview` (preview container ID), and `data-label` (label ID) properties, then activates the modal.\n  * **Selections**: Captures selections inside the modal, injects the selected media path into the active target input field, updates the corresponding thumbnail preview container, updates the file label name, reveals the \"Supprimer\" button, and closes the modal automatically.\n  * **Removals**         // Initialize Renderer
        marked.setOptions({
            breaks: true,
            gfm: true
        });

        // Add Copy Button to code blocks
        function addCopyButtons() {
            document.querySelectorAll('pre').forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                
                pre.style.position = 'relative';
                
                const btn = document.createElement('button');
                btn.className = 'copy-btn absolute top-2 right-2 bg-slate-800/90 hover:bg-slate-700/90 text-slate-400 hover:text-white px-2 py-1 rounded text-xs transition border border-slate-700/80 flex items-center gap-1.5 opacity-0 group-hover:opacity-100 focus:opacity-100';
                btn.innerHTML = '<i class="far fa-copy"></i> Copier';
                
                btn.addEventListener('click', () => {
                    const code = pre.querySelector('code');
                    const text = code ? code.innerText : pre.innerText;
                    navigator.clipboard.writeText(text).then(() => {
                        btn.innerHTML = '<i class="fas fa-check text-emerald-400"></i> Copié !';
                        setTimeout(() => {
                            btn.innerHTML = '<i class="far fa-copy"></i> Copier';
                        }, 2000);
                    });
                });
                
                // Add group class to pre to handle hover
                pre.classList.add('group');
                pre.appendChild(btn);
            });
        }

        // Render Conversation List
        function renderConvList() {
            convListEl.innerHTML = '';
            data.forEach(c => {
                const isActive = c.id === activeConvId;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-2.5 rounded-lg flex items-center gap-3 transition ${isActive ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/40 border border-transparent'}`;
                btn.onclick = () => selectConversation(c.id);
                
                btn.innerHTML = `
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${isActive ? 'bg-sky-500/20' : 'bg-slate-800'}">
                        <i class="fas ${c.icon || 'fa-comments'} text-sm"></i>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-xs font-semibold truncate leading-tight">${c.title}</p>
                        <p class="text-[10px] text-slate-500 truncate mt-0.5">${c.turns.length} échanges</p>
                    </div>
                `;
                convListEl.appendChild(btn);
            });
        }

        // Render Active Conversation
        function renderActiveConversation() {
            const conv = data.find(c => c.id === activeConvId);
            if (!conv) return;

            // 1. Render Table of Contents
            turnsNavEl.innerHTML = '';
            conv.turns.forEach((turn, idx) => {
                const link = document.createElement('a');
                link.href = `#turn-${idx}`;
                link.className = "flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800/30 transition truncate";
                
                // Extract brief preview of user query
                let preview = turn.user.substring(0, 30);
                if (turn.user.length > 30) preview += "...";
                
                link.innerHTML = `
                    <span class="w-4 h-4 rounded-full bg-slate-800 border border-slate-700/60 flex items-center justify-center flex-shrink-0 text-[10px] font-bold text-slate-400">${idx + 1}</span>
                    <span class="truncate">${preview}</span>
                `;
                
                link.onclick = (e) => {
                    e.preventDefault();
                    document.getElementById(`turn-${idx}`).scrollIntoView({ behavior: 'smooth' });
                };
                
                turnsNavEl.appendChild(link);
            });

            // 2. Render Chat Messages
            chatViewportEl.innerHTML = `
                <!-- Intro Card -->
                <div class="max-w-4xl mx-auto p-6 rounded-2xl bg-gradient-to-r from-slate-900 to-slate-900/60 border border-slate-800/80 shadow-lg">
                    <h2 class="font-heading font-bold text-lg text-slate-100 flex items-center gap-2 mb-2">
                        <i class="fas ${conv.icon} text-sky-400"></i> ${conv.title}
                    </h2>
                    <p class="text-xs text-slate-400 leading-relaxed">${conv.desc}</p>
                    <div class="mt-4 flex flex-wrap gap-4 text-slate-500 text-[10px] font-mono border-t border-slate-800/80 pt-4">
                        <div>ID: <span class="text-slate-400 font-semibold">${conv.id}</span></div>
                        <div>Échanges: <span class="text-slate-400 font-semibold">${conv.turns.length}</span></div>
                    </div>
                </div>
            `;

            conv.turns.forEach((turn, idx) => {
                const turnContainer = document.createElement('div');
                turnContainer.id = `turn-${idx}`;
                turnContainer.className = "max-w-4xl mx-auto space-y-6 pt-4 border-t border-slate-900 first:border-t-0";

                // Tool Pills
                let toolsHtml = '';
                if (turn.tool_calls && turn.tool_calls.length > 0) {
                    toolsHtml = `
                        <div class="flex flex-wrap items-center gap-1.5 pb-2 text-[10px] font-mono text-slate-400">
                            <span class="text-slate-500 font-bold uppercase tracking-wider mr-1">Actions:</span>
                            ${turn.tool_calls.map(t => `<span class="bg-slate-800/60 border border-slate-700/40 text-slate-300 px-2 py-0.5 rounded-md hover:bg-slate-800 transition">${t}</span>`).join('')}
                        </div>
                    `;
                }

                // Append user bubble
                turnContainer.innerHTML += `
                    <!-- User Message -->
                    <div class="flex items-start gap-4 flex-row-reverse">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center flex-shrink-0 text-white font-bold text-sm shadow-md shadow-indigo-500/10">
                            U
                        </div>
                        <div class="flex flex-col items-end max-w-[85%]">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-[10px] text-slate-500 font-mono">${turn.timestamp}</span>
                                <span class="text-xs font-semibold text-slate-300">Utilisateur</span>
                            </div>
                            <div class="chat-bubble-user bg-indigo-600/90 text-white px-4 py-3 rounded-2xl rounded-tr-none text-sm leading-relaxed shadow-md shadow-indigo-600/5 select-text whitespace-pre-wrap font-medium font-sans">
                                ${escapeHtml(turn.user)}
                            </div>
                        </div>
                    </div>
                `;

                // Append assistant bubble
                turnContainer.innerHTML += `
                    <!-- Assistant Message -->
                    <div class="flex items-start gap-4">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center flex-shrink-0 text-white shadow-md shadow-sky-500/10">
                            <i class="fas fa-robot text-sm"></i>
                        </div>
                        <div class="flex flex-col items-start max-w-[85%]">
                            <div class="flex items-center gap-2 mb-1.5">
                                <span class="text-xs font-semibold text-sky-400">Antigravity</span>
                                <span class="text-[10px] text-slate-500 font-mono">${turn.timestamp}</span>
                            </div>
                            <div class="chat-bubble-assistant w-full bg-slate-900 border border-slate-800/80 text-slate-200 px-5 py-4 rounded-2xl rounded-tl-none text-sm leading-relaxed shadow-lg shadow-slate-950/20 select-text">
                                ${toolsHtml}
                                <div class="markdown-content">
                                    ${marked.parse(turn.assistant)}
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                chatViewportEl.appendChild(turnContainer);
            });

            // Post-render stuff
            Prism.highlightAll();
            addCopyButtons();
        }

        // Helper to escape HTML for user messages
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Change Active Conversation
        function selectConversation(id) {
            activeConvId = id;
            renderConvList();
            renderActiveConversation();
        }

        // Search mechanism
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            
            // Search in bubbles
            document.querySelectorAll('.chat-bubble-user, .chat-bubble-assistant').forEach(bubble => {
                const text = bubble.innerText.toLowerCase();
                const parentNode = bubble.closest('.space-y-6');
                if (!parentNode) return;
                
                if (query === '' || text.includes(query)) {
                    parentNode.style.display = 'block';
                } else {
                    // Check if both user and assistant in this turn fail the query
                    const userText = parentNode.querySelector('.chat-bubble-user').innerText.toLowerCase();
                    const assistantText = parentNode.querySelector('.chat-bubble-assistant').innerText.toLowerCase();
                    if (!userText.includes(query) && !assistantText.includes(query)) {
                        parentNode.style.display = 'none';
                    } else {
                        parentNode.style.display = 'block';
                    }
                }
            });
        });

        // Initialize
        renderConvList();
        renderActiveConversation();
    </script>
    <!-- PrismJS syntax highlighting script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-php.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
</body>
