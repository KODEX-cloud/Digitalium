# ═══════════════════════════════════════════════════════════════════════════════
# DIGITALIUM GROUP CMS — Enterprise Deployment Pipeline v2.0
# ═══════════════════════════════════════════════════════════════════════════════
#
# Pipeline autonome, auto-réparable, avec rollback automatique.
#
# SECRETS REQUIS (GitHub → Settings → Secrets → Actions) :
#   HOSTINGER_SSH_HOST    IP/hostname Hostinger (ex: 145.14.x.x)
#   HOSTINGER_SSH_PORT    Port SSH (défaut: 65002)
#   HOSTINGER_SSH_USER    Utilisateur SSH (ex: u839163661)
#   HOSTINGER_SSH_KEY     Clé privée SSH complète (-----BEGIN...)
#   HOSTINGER_SITE_PATH   Chemin absolu du site sur le serveur
#   HOSTINGER_PHP_BIN     Binaire PHP (ex: php8.3 ou /usr/local/bin/php)
#   APP_URL               URL publique (https://digitaliumgroup.com)
#   SLACK_WEBHOOK_URL     (optionnel) Webhook Slack
#
# Documentation : docs/github-secrets.md
# ═══════════════════════════════════════════════════════════════════════════════

name: Deploy — Digitalium Group CMS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'PROJECT_STATE.md'
      - 'CHANGELOG.md'
      - 'IMPLEMENTATION_PLAN.md'
      - 'TECHNICAL_AUDIT.md'
      - 'RISK_ANALYSIS.md'
      - 'CMS_MASTER_ARCHITECTURE.md'
      - 'PROJECT_MAP.md'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de déploiement'
        required: false
        default: 'full'
        type: choice
        options: [full, quick, repair, rollback]
      dry_run:
        description: 'Dry run (simulation sans modification)'
        required: false
        default: false
        type: boolean

concurrency:
  group: production-deploy
  cancel-in-progress: false

# ─────────────────────────────────────────────────────────────────────────────
# JOB 0 — PRE-FLIGHT : Validation des secrets avant toute action
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  preflight:
    name: Pre-flight — Validation secrets
    runs-on: ubuntu-latest
    steps:
      - name: Vérification secrets requis
        env:
          S_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          S_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          S_KEY:  ${{ secrets.HOSTINGER_SSH_KEY }}
          S_SITE: ${{ secrets.HOSTINGER_SITE_PATH }}
        run: |
          MISSING=()
          [ -z "$S_HOST" ] && MISSING+=("HOSTINGER_SSH_HOST")
          [ -z "$S_USER" ] && MISSING+=("HOSTINGER_SSH_USER")
          [ -z "$S_KEY"  ] && MISSING+=("HOSTINGER_SSH_KEY")
          [ -z "$S_SITE" ] && MISSING+=("HOSTINGER_SITE_PATH")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════"
            echo "  ❌  SECRETS MANQUANTS — DÉPLOIEMENT BLOQUÉ"
            echo "════════════════════════════════════════════════════════════"
            echo ""
            echo "  Les secrets GitHub suivants ne sont pas configurés :"
            echo ""
            for s in "${MISSING[@]}"; do
              echo "    ✗  $s"
            done
            echo ""
            echo "  COMMENT CONFIGURER :"
            echo "  ─────────────────────────────────────────────────────────"
            echo "  1. Va sur :"
            echo "     https://github.com/KODEX-cloud/Digitalium/settings/secrets/actions"
            echo ""
            echo "  2. Clique 'New repository secret' pour chaque secret :"
            echo "     HOSTINGER_SSH_HOST   → IP SSH de ton hébergement Hostinger"
            echo "     HOSTINGER_SSH_PORT   → Port SSH (généralement 65002)"
            echo "     HOSTINGER_SSH_USER   → Utilisateur SSH Hostinger"
            echo "     HOSTINGER_SSH_KEY    → Clé privée SSH complète"
            echo "     HOSTINGER_SITE_PATH  → Chemin absolu du site"
            echo "     HOSTINGER_PHP_BIN    → Binaire PHP (ex: php8.3)"
            echo "     APP_URL              → https://digitaliumgroup.com"
            echo ""
            echo "  3. Documentation complète : docs/github-secrets.md"
            echo ""
            echo "════════════════════════════════════════════════════════════"
            exit 1
          fi

          echo "✓ HOSTINGER_SSH_HOST    présent"
          echo "✓ HOSTINGER_SSH_USER    présent"
          echo "✓ HOSTINGER_SSH_KEY     présent"
          echo "✓ HOSTINGER_SITE_PATH   présent"
          echo ""
          echo "✅ Tous les secrets requis sont configurés — déploiement autorisé"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — SYNTAX CHECK : Validation PHP
# ─────────────────────────────────────────────────────────────────────────────
  syntax-check:
    name: PHP Syntax Validation
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP Syntax Check
        run: |
          echo "=== PHP Syntax Check ==="
          ERRORS=0
          while IFS= read -r file; do
            result=$(php -l "$file" 2>&1)
            if echo "$result" | grep -q "Errors parsing"; then
              echo "  ✗ ERREUR : $file"
              echo "    $result"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app database bin -name "*.php" 2>/dev/null)

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "❌ $ERRORS fichier(s) avec erreurs de syntaxe PHP"
            exit 1
          fi
          echo "✓ Aucune erreur de syntaxe PHP détectée"

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — DEPLOY : Déploiement production via SSH
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    needs: [preflight, syntax-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Informations de déploiement
        run: |
          echo ""
          echo "╔═══════════════════════════════════════════════╗"
          echo "║     DIGITALIUM — PRODUCTION DEPLOY v2.0      ║"
          echo "╠═══════════════════════════════════════════════╣"
          echo "║  Commit  : ${{ github.sha }}"
          echo "║  Branche : ${{ github.ref_name }}"
          echo "║  Acteur  : ${{ github.actor }}"
          echo "║  Mode    : ${{ github.event.inputs.mode || 'full' }}"
          echo "║  Date    : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "╚═══════════════════════════════════════════════╝"

      - name: SSH — Deploy Enterprise
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA:  ${{ github.sha }}
          DEPLOY_MODE: ${{ github.event.inputs.mode || 'full' }}
          DEPLOY_DRY:  ${{ github.event.inputs.dry_run || 'false' }}
          APP_URL:     ${{ secrets.APP_URL || 'https://digitaliumgroup.com' }}
        with:
          host:     ${{ secrets.HOSTINGER_SSH_HOST }}
          port:     ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key:      ${{ secrets.HOSTINGER_SSH_KEY }}
          timeout:  300s
          envs:     DEPLOY_SHA,DEPLOY_MODE,DEPLOY_DRY,APP_URL
          script: |
            set -euo pipefail
            STEP=0
            START=$(date +%s)
            SITE="${{ secrets.HOSTINGER_SITE_PATH }}"
            PHP_CANDIDATES="${{ secrets.HOSTINGER_PHP_BIN || '' }} php8.3 php8 php /usr/local/bin/php /usr/bin/php"
            FAILED_TESTS=0

            # ── Résolution PHP ────────────────────────────────────────────────
            PHP=""
            for candidate in $PHP_CANDIDATES; do
              if command -v "$candidate" &>/dev/null 2>&1; then
                PHP="$candidate"
                break
              fi
            done
            if [ -z "$PHP" ]; then
              echo "❌ Aucun binaire PHP trouvé. Configurer HOSTINGER_PHP_BIN."
              exit 1
            fi
            PHP_VER=$($PHP -r 'echo PHP_VERSION;' 2>/dev/null || echo 'inconnu')

            echo ""
            echo "╔═══════════════════════════════════════════════╗"
            echo "║  DIGITALIUM ENTERPRISE DEPLOY — START         ║"
            echo "║  $(date '+%Y-%m-%d %H:%M:%S')                 ║"
            echo "╚═══════════════════════════════════════════════╝"
            echo "  PHP    : $PHP ($PHP_VER)"
            echo "  Site   : $SITE"
            echo "  Commit : ${DEPLOY_SHA:0:7}"
            echo "  Mode   : $DEPLOY_MODE"

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 1 — Initialisation / Clone ou Pull Git
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] GIT — SYNCHRONISATION ==="

            if [ -z "$SITE" ]; then
              echo "❌ HOSTINGER_SITE_PATH est vide"
              exit 1
            fi

            if [ ! -d "$SITE" ]; then
              echo "  ⚡ Dossier absent — création"
              mkdir -p "$SITE"
            fi

            if [ ! -d "$SITE/.git" ]; then
              echo "  ⚡ Premier déploiement — initialisation Git"
              cd "$SITE"
              git init -b main
              git remote add origin https://github.com/KODEX-cloud/Digitalium.git
              git fetch origin main --depth=1
              git reset --hard origin/main
              echo "  ✓ Dépôt cloné avec succès"
            else
              echo "  → Mise à jour du dépôt existant"
              cd "$SITE"
              # Sauvegarder les modifications locales non-committées si elles existent
              if ! git diff --quiet 2>/dev/null || ! git diff --cached --quiet 2>/dev/null; then
                git stash push -m "auto-stash-$(date +%Y%m%d-%H%M%S)" --include-untracked 2>/dev/null || true
                echo "  ✓ Modifications locales sauvegardées (stash)"
              fi
              # Une seule tentative supplémentaire : le déploiement de fd30aa8 a
              # échoué ici (étape SSH de 136 s contre 13 s d'habitude), laissant
              # la production sur le commit précédent sans que rien ne soit
              # appliqué. Un échec réseau passager ne doit pas coûter un
              # déploiement entier. Si la seconde tentative échoue aussi,
              # `set -e` interrompt : mieux vaut un déploiement en échec qu'un
              # déploiement silencieusement parti sur du code périmé.
              if ! git fetch origin main; then
                echo "  ⚠ git fetch a échoué — nouvelle tentative dans 5 s"
                sleep 5
                git fetch origin main
              fi
              BEFORE=$(git rev-parse --short HEAD 2>/dev/null || echo 'init')
              git reset --hard origin/main
              AFTER=$(git rev-parse --short HEAD)
              echo "  ✓ Git sync OK : $BEFORE → $AFTER"
            fi

            # Reset OPcache pour forcer le rechargement des fichiers PHP
            $PHP -r "if (function_exists('opcache_reset')) { opcache_reset(); echo '  ✓ OPcache reset OK'.PHP_EOL; } else { echo '  · OPcache non disponible'.PHP_EOL; }" 2>/dev/null || true

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 2 — Permissions
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] PERMISSIONS ==="
            cd "$SITE"
            # Créer les dossiers requis s'ils n'existent pas
            for dir in storage storage/logs storage/cache storage/sessions public/uploads; do
              mkdir -p "$dir"
            done
            # Appliquer les permissions
            find storage -type d -exec chmod 755 {} \; 2>/dev/null || true
            find storage -type f -exec chmod 644 {} \; 2>/dev/null || true
            chmod -R 777 storage/logs storage/cache storage/sessions 2>/dev/null || true
            chmod -R 755 public/uploads 2>/dev/null || true
            # Rendre les scripts bin exécutables
            find bin -name "*.php" -exec chmod +x {} \; 2>/dev/null || true
            echo "  ✓ Permissions appliquées"

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 3 — Master Migration
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] MIGRATIONS ==="
            if [ -f "database/master_migration.php" ]; then
              if $PHP database/master_migration.php 2>&1; then
                echo "  ✓ Master migration OK"
              else
                echo "  ⚠ Master migration warning (non-bloquant)"
              fi
            else
              echo "  ⚠ database/master_migration.php introuvable"
            fi

            if [ -f "database/sync_production.php" ]; then
              if $PHP database/sync_production.php 2>&1; then
                echo "  ✓ Sync production OK"
              else
                echo "  ⚠ Sync production warning (non-bloquant)"
              fi
            fi

            if [ -f "database/build_home_v2.php" ]; then
              if $PHP database/build_home_v2.php 2>&1; then
                echo "  ✓ Build Homepage v2 OK (no-op si déjà activée — voir storage/homepage_v2.lock)"
              else
                echo "  ⚠ Build Homepage v2 warning (non-bloquant)"
              fi
            fi

            if [ -f "database/set_brand_theme_v2.php" ]; then
              if $PHP database/set_brand_theme_v2.php 2>&1; then
                echo "  ✓ Set Brand Theme v2 OK"
              else
                echo "  ⚠ Set Brand Theme v2 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/apply_theme_v3.php" ]; then
              if $PHP database/apply_theme_v3.php 2>&1; then
                echo "  ✓ Apply Theme v3 OK (no-op si déjà appliqué — voir storage/theme_v3.lock)"
              else
                echo "  ⚠ Apply Theme v3 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/apply_typography_v3.php" ]; then
              if $PHP database/apply_typography_v3.php 2>&1; then
                echo "  ✓ Apply Typography v3 OK (no-op si déjà appliqué)"
              else
                echo "  ⚠ Apply Typography v3 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/build_hero_v4.php" ]; then
              if $PHP database/build_hero_v4.php 2>&1; then
                echo "  ✓ Build Hero v4 OK (no-op si déjà construit — voir storage/hero_v4.lock)"
              else
                echo "  ⚠ Build Hero v4 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/build_service_v2.php" ]; then
              if $PHP database/build_service_v2.php 2>&1; then
                echo "  ✓ Build Service v2 OK"
              else
                echo "  ⚠ Build Service v2 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/fix_hero_badge_v4.php" ]; then
              if $PHP database/fix_hero_badge_v4.php 2>&1; then
                echo "  ✓ Fix Hero Badge v4 OK"
              else
                echo "  ⚠ Fix Hero Badge v4 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/build_sectors_page.php" ]; then
              if $PHP database/build_sectors_page.php 2>&1; then
                echo "  ✓ Build Sectors Page OK"
              else
                echo "  ⚠ Build Sectors Page warning (non-bloquant)"
              fi
            fi
            if [ -f "database/build_realisations_page.php" ]; then
              if $PHP database/build_realisations_page.php 2>&1; then
                echo "  OK Build Realisations Page"
              else
                echo "  ATTENTION Build Realisations Page (non-bloquant)"
              fi
            fi
            if [ -f "database/build_solutions_page.php" ]; then
              if $PHP database/build_solutions_page.php 2>&1; then
                echo "  OK Build Solutions Page"
              else
                echo "  ATTENTION Build Solutions Page (non-bloquant)"
              fi
            fi
            if [ -f "database/build_contact_page.php" ]; then
              if $PHP database/build_contact_page.php 2>&1; then
                echo "  OK Build Contact Page"
              else
                echo "  ATTENTION Build Contact Page (non-bloquant)"
              fi
            fi
            if [ -f "database/build_insights_page.php" ]; then
              if $PHP database/build_insights_page.php 2>&1; then
                echo "  OK Build Insights Page"
              else
                echo "  ATTENTION Build Insights Page (non-bloquant)"
              fi
            fi
            # Vues referencant une classe non resolvable : invisible pour le
            # controle de syntaxe, mais fatal a l'affichage (cf. le 500 de
            # /admin/menus/edit). Non bloquant : on signale, on ne bloque pas.
            if [ -f "bin/check_views.php" ]; then
              if $PHP bin/check_views.php 2>&1; then
                echo "  OK Controle des vues"
              else
                echo "  ATTENTION des vues referencent une classe non resolvable (non-bloquant)"
              fi
            fi
            if [ -f "database/build_menus_v2.php" ]; then
              if $PHP database/build_menus_v2.php 2>&1; then
                echo "  OK Build Menus v2"
              else
                echo "  ATTENTION Build Menus v2 (non-bloquant)"
              fi
            fi
            if [ -f "database/build_labs_page.php" ]; then
              if $PHP database/build_labs_page.php 2>&1; then
                echo "  OK Build Labs Page"
              else
                echo "  ATTENTION Build Labs Page (non-bloquant)"
              fi
            fi
            if [ -f "database/build_about_page.php" ]; then
              if $PHP database/build_about_page.php 2>&1; then
                echo "  OK Build About Page"
              else
                echo "  ATTENTION Build About Page (non-bloquant)"
              fi
            fi
            if [ -f "database/seed_demo_content.php" ]; then
              if $PHP database/seed_demo_content.php 2>&1; then
                echo "  OK Seed Demo Content"
              else
                echo "  ATTENTION Seed Demo Content (non-bloquant)"
              fi
            fi
            if [ -f "database/build_footer_v5.php" ]; then
              if $PHP database/build_footer_v5.php 2>&1; then
                echo "  ✓ Build Footer v5 OK"
              else
                echo "  ⚠ Build Footer v5 warning (non-bloquant)"
              fi
            fi
            if [ -f "database/fix_hero_layout_v2.php" ]; then
              if $PHP database/fix_hero_layout_v2.php 2>&1; then
                echo "  ✓ Fix Hero Layout v2 OK"
              else
                echo "  ⚠ Fix Hero Layout v2 warning (non-bloquant)"
              fi
            fi

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 4 — Cache Clear
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] CACHE ==="
            CACHE_COUNT=0
            if [ -d "storage/cache" ]; then
              CACHE_COUNT=$(find storage/cache -name "*.php" -o -name "*.cache" 2>/dev/null | wc -l)
              find storage/cache -type f \( -name "*.php" -o -name "*.cache" -o -name "*.json" \) -delete 2>/dev/null || true
            fi
            echo "  ✓ Cache vidé ($CACHE_COUNT fichiers supprimés)"

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 5 — Deploy Pipeline (bin/deploy.php)
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] DEPLOY PIPELINE ==="
            if [ -f "bin/deploy.php" ]; then
              DRY_FLAG=""
              [ "$DEPLOY_DRY" = "true" ] && DRY_FLAG="--dry-run"
              DEPLOY_EXIT=0
              $PHP bin/deploy.php --mode="$DEPLOY_MODE" --base-url="$APP_URL" $DRY_FLAG 2>&1 || DEPLOY_EXIT=$?
              if [ $DEPLOY_EXIT -eq 0 ]; then
                echo "  ✓ Deploy pipeline OK"
              else
                echo "  ⚠ Deploy pipeline exit=$DEPLOY_EXIT (non-bloquant — poursuite)"
              fi
            else
              echo "  ⚠ bin/deploy.php introuvable — étape ignorée"
            fi

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 6 — Vérification fichiers critiques
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] VÉRIFICATION INTÉGRITÉ ==="
            CRITICAL_FILES=(
              "public/index.php"
              "app/Services/Router.php"
              "app/Services/Database.php"
              "config/config.php"
              "routes/web.php"
            )
            ALL_OK=true
            for f in "${CRITICAL_FILES[@]}"; do
              if [ -f "$f" ]; then
                echo "  ✓ $f"
              else
                echo "  ✗ MANQUANT: $f"
                ALL_OK=false
              fi
            done
            if [ "$ALL_OK" = false ]; then
              echo "  ⚠ Certains fichiers critiques sont absents — vérifier le dépôt"
            fi

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 7 — Smoke Tests HTTP
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] SMOKE TESTS HTTP ==="
            # Attendre que le serveur soit prêt
            sleep 3
            HTTP_PATHS=("/" "/blog" "/realisations" "/sitemap.xml")
            for PATH_TEST in "${HTTP_PATHS[@]}"; do
              URL="$APP_URL$PATH_TEST"
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --location "$URL" 2>/dev/null || echo "000")
              if [ "$CODE" = "200" ] || [ "$CODE" = "301" ] || [ "$CODE" = "302" ]; then
                echo "  ✓ HTTP $CODE — $URL"
              else
                echo "  ✗ HTTP $CODE — $URL"
                FAILED_TESTS=$((FAILED_TESTS+1))
              fi
            done

            # ─────────────────────────────────────────────────────────────────
            # ÉTAPE 8 — Résumé
            # ─────────────────────────────────────────────────────────────────
            STEP=$((STEP+1))
            echo ""
            echo "=== [$STEP/8] RÉSUMÉ ==="
            END=$(date +%s)
            DURATION=$((END - START))
            echo "  Commit       : ${DEPLOY_SHA:0:7}"
            echo "  Mode         : $DEPLOY_MODE"
            echo "  Durée totale : ${DURATION}s"
            echo "  Tests HTTP   : $((${#HTTP_PATHS[@]} - FAILED_TESTS))/${#HTTP_PATHS[@]} OK"
            echo ""

            if [ "$FAILED_TESTS" -ge 3 ]; then
              echo "❌ DÉPLOIEMENT DÉGRADÉ — $FAILED_TESTS page(s) inaccessible(s)"
              echo "   Vérifier les logs : storage/logs/"
              exit 1
            fi

            echo "╔═══════════════════════════════════════════════╗"
            echo "║  ✅  DÉPLOIEMENT RÉUSSI                       ║"
            echo "║  $(date '+%Y-%m-%d %H:%M:%S')                 ║"
            echo "╚═══════════════════════════════════════════════╝"

      # ── Notification succès ──────────────────────────────────────────────
      - name: Notification succès
        if: success()
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          echo "✅ Digitalium déployé — commit $SHORT — acteur ${{ github.actor }}"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"✅ *Digitalium* déployé avec succès\nCommit: \`$SHORT\`\nActeur: ${{ github.actor }}\nURL: ${{ secrets.APP_URL || 'https://digitaliumgroup.com' }}\"}" || true
          fi

      # ── Notification échec ───────────────────────────────────────────────
      - name: Notification échec
        if: failure()
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          echo "❌ Digitalium ÉCHEC déploiement — commit $SHORT"
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"❌ *Digitalium* DÉPLOIEMENT ÉCHOUÉ\nCommit: \`$SHORT\`\nActeur: ${{ github.actor }}\nLogs: https://github.com/KODEX-cloud/Digitalium/actions/runs/${{ github.run_id }}\"}" || true
          fi

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — ROLLBACK : Uniquement sur workflow_dispatch --mode=rollback
# ─────────────────────────────────────────────────────────────────────────────
  rollback:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    if: github.event.inputs.mode == 'rollback'

    steps:
      - name: SSH — Rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.HOSTINGER_SSH_HOST }}
          port:     ${{ secrets.HOSTINGER_SSH_PORT || 65002 }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key:      ${{ secrets.HOSTINGER_SSH_KEY }}
          timeout:  120s
          script: |
            PHP="${{ secrets.HOSTINGER_PHP_BIN || 'php' }}"
            SITE="${{ secrets.HOSTINGER_SITE_PATH }}"
            cd "$SITE"
            echo "=== ROLLBACK D'URGENCE ==="
            $PHP bin/deploy.php --mode=rollback 2>&1 || true
            echo "✓ Rollback terminé — $(date '+%Y-%m-%d %H:%M:%S')"
